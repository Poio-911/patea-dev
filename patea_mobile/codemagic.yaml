# Build de iOS para TestFlight.
#
# Vive en el repo y no sólo en la interfaz de Codemagic a propósito: así la
# receta queda versionada y cualquiera puede ver con qué se compiló una
# release. En Codemagic hay que elegir "codemagic.yaml" como fuente de la
# configuración del workflow.
#
# Antes de que corra hacen falta dos cosas cargadas en Codemagic:
#
#   1. Una integración de App Store Connect con una clave de API (Users and
#      Access > Integrations > App Store Connect API en App Store Connect).
#      La clave necesita rol "App Manager" para poder subir a TestFlight.
#      En Codemagic se carga en Teams > Integrations > Apple Developer Portal.
#
#   2. Un grupo de variables llamado `patea_ios` con:
#        APP_STORE_APPLE_ID  -> el "Apple ID" numérico de la app en App Store
#                               Connect (App Information > General Information)
#
# El certificado y el perfil NO se cargan a mano: `automatic_code_signing`
# los emite y los renueva solo usando la clave de API. Es lo que evita el
# baile de certificados vencidos.

workflows:
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: patea

    environment:
      groups:
        - patea_ios
      vars:
        BUNDLE_ID: "com.patea.app"
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.patea.app

    scripts:
      - name: Dependencias de Flutter
        script: flutter pub get

      - name: Firmar automáticamente
        # Emite (o reusa) el certificado de distribución y el provisioning
        # profile, y los deja aplicados en el proyecto de Xcode.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Número de build
        # El build number lo manda TestFlight, no el pubspec: dos subidas con
        # el mismo número se rechazan, y acá se toma el último publicado y se
        # le suma uno. Así no hay que acordarse de subirlo a mano.
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --increment)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Compilar el IPA
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Sin grupos: la build queda disponible para los testers internos.
        # Para probadores externos hay que agregar `beta_groups:` con el
        # nombre del grupo, y esos sí pasan por revisión de Apple.
      email:
        recipients:
          - santiago.lopez@agileworks.com.uy
        notify:
          success: true
          failure: true
