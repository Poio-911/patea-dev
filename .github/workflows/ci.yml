name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patea_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test --reporter expanded

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Compilar (tsc)
        run: npm run build

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tests unitarios
        run: npm run test:unit -- --run
        continue-on-error: true

  rules:
    name: Reglas de Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Compila las reglas sin desplegarlas. Detecta errores de sintaxis antes
      # de que lleguen a producción; la verificación de comportamiento real
      # (qué se permite y qué no) está en scripts/verify-firestore-rules.mjs,
      # que necesita credenciales y por eso no corre acá.
      - name: Validar sintaxis de las reglas
        run: |
          npm install -g firebase-tools
          npx firebase-tools@latest emulators:exec \
            --only firestore \
            --project demo-patea \
            "echo 'reglas compiladas correctamente'"
