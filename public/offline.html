<!DOCTYPE html>
<html lang="es-UY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0E13">
  <title>Sin conexión · Pateá</title>
  <style>
    :root { color-scheme: dark; --navy: #0B0E13; --volt: #CCFF33; --ink: #F8FAFC; --muted: #B3BDCC; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--navy); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { width: min(100%, 68rem); min-height: 100vh; min-height: 100svh; margin: auto; padding: clamp(1.5rem, 5vw, 4rem); display: flex; flex-direction: column; }
    .brand { display: inline-flex; align-items: center; gap: .7rem; width: fit-content; font-size: 2rem; font-weight: 750; letter-spacing: -.08rem; }
    .brand-mark { width: 2.6rem; height: 2.6rem; flex: none; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 4rem 0; max-width: 36rem; }
    .connection { display: flex; align-items: center; gap: .65rem; margin: 0 0 1.3rem; color: var(--muted); font-size: .95rem; }
    .connection::before { content: ""; width: .5rem; height: .5rem; border: 1px solid currentColor; border-radius: 50%; flex: none; }
    h1 { margin: 0; font-size: clamp(2.2rem, 6.5vw, 4rem); line-height: 1.08; font-weight: 750; letter-spacing: -.045em; text-wrap: balance; }
    .instruction { max-width: 31rem; margin: 1.4rem 0 2rem; color: var(--muted); font-size: 1.1rem; line-height: 1.65; }
    button { min-height: 3.25rem; max-width: 100%; border: 1px solid transparent; border-radius: .8rem; padding: .9rem 1.75rem; background: var(--volt); color: var(--navy); font: inherit; font-weight: 700; cursor: pointer; transition: background-color 150ms ease; }
    button:hover { background: #D9FF70; }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }
    button:active { background: #B9EB20; }
    footer { border-top: 1px solid #293341; padding-top: 1.3rem; color: var(--muted); font-size: .85rem; line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>

  <div class="page">

    <main id="contenido">
      <p class="connection">Sin conexión</p>
      <h1>Se cortó la conexión.<br>Seguimos en equipo.</h1>
      <p class="instruction">Revisá el Wi-Fi o los datos móviles y volvé a cargar la página para continuar.</p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
    <footer>El fútbol que nos junta.</footer>
  </div>

</html>
