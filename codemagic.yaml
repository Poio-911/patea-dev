# Build de iOS para TestFlight.
#
# Vive en la raíz del repo porque Codemagic sólo busca `codemagic.yaml` ahí,
# aunque la app Flutter esté en `patea_mobile/` — de eso se encarga el
# `working_directory` del workflow. En Codemagic hay que elegir
# "codemagic.yaml" como fuente de la configuración del workflow.
#
# Lo que tiene que estar cargado en Codemagic para que esto corra:
#
#   1. Integración de App Store Connect llamada `patea`, con la clave de API
#      "codemagic" (rol "Gestor de apps", Key ID A2R79NVDJ3) generada en App
#      Store Connect > Usuarios y acceso > Integraciones.
#
#   2. Grupo de variables `patea_ios` con:
#        APP_STORE_APPLE_ID -> 6808798274 (el "Apple ID" numérico de la app en
#                              App Store Connect, el que aparece en la URL)
#
#   3. En Team settings > Code signing identities:
#        - certificado `patea_distribution` (generado por Codemagic, que se
#          queda con la clave privada)
#        - perfil `patea_appstore` (App Store, com.patea.app)

workflows:
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # La app Flutter no está en la raíz del repo: todo el workflow corre acá.
    working_directory: patea_mobile

    integrations:
      app_store_connect: patea

    environment:
      groups:
        - patea_ios
      flutter: stable
      xcode: latest
      cocoapods: default

      # Firma con material guardado en Codemagic (Team settings > Code signing
      # identities), no emitido al vuelo. Se llegó acá porque el equipo de Apple
      # ya tenía un certificado de distribución de otra app cuya clave privada
      # Codemagic no tiene: `fetch-signing-files --create` lo encontraba, no
      # podía usarlo ("Cannot save Signing Certificates without certificate
      # private key") y entonces tampoco emitía el perfil. El certificado
      # `patea_distribution` lo generó Codemagic, así que sí tiene su clave.
      ios_signing:
        certificates:
          - patea_distribution
        provisioning_profiles:
          - patea_appstore

    scripts:
      - name: Dependencias de Flutter
        script: flutter pub get

      - name: Aplicar la firma al proyecto de Xcode
        # Codemagic ya dejó certificado y perfil en el llavero; esto los
        # escribe en el proyecto y genera /Users/builder/export_options.plist,
        # que usa el build.
        script: xcode-project use-profiles

      - name: Pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Número de build
        # El build number lo manda TestFlight, no el pubspec: dos subidas con
        # el mismo número se rechazan, y acá se toma el último publicado y se
        # le suma uno. Así no hay que acordarse de subirlo a mano.
        script: |
          # La primera vez no hay ninguna build publicada y el comando falla:
          # ahí se arranca en 1.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            BUILD_NUMBER=1
          else
            BUILD_NUMBER=$((LATEST + 1))
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Compilar el IPA
        # El export_options.plist lo deja `xcode-project use-profiles`.
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Sin grupos: la build queda disponible para los testers internos.
        # Para probadores externos hay que agregar `beta_groups:` con el
        # nombre del grupo, y esos sí pasan por revisión de Apple.
      email:
        recipients:
          - santiago.lopez@agileworks.com.uy
        notify:
          success: true
          failure: true
