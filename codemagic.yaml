# Build de iOS para TestFlight.
#
# Vive en la raíz del repo porque Codemagic sólo busca `codemagic.yaml` ahí,
# aunque la app Flutter esté en `patea_mobile/` — de eso se encarga el
# `working_directory` del workflow. En Codemagic hay que elegir
# "codemagic.yaml" como fuente de la configuración del workflow.
#
# Antes de que corra hacen falta dos cosas cargadas en Codemagic:
#
#   1. Una integración de App Store Connect llamada `patea`, con la clave de
#      API "codemagic" (rol "Gestor de apps") generada en App Store Connect en
#      Usuarios y acceso > Integraciones. Se carga en Codemagic en
#      Teams > Personal Account > Integrations > Developer Portal.
#
#   2. Un grupo de variables llamado `patea_ios` con:
#        APP_STORE_APPLE_ID -> 6808798274 (el "Apple ID" numérico de la app en
#                              App Store Connect, el que aparece en la URL)
#
# El certificado y el perfil NO se cargan a mano: el bloque `ios_signing` los
# emite y los renueva solo usando la clave de API. Es lo que evita el baile de
# certificados vencidos.

workflows:
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # La app Flutter no está en la raíz del repo: todo el workflow corre acá.
    working_directory: patea_mobile

    integrations:
      app_store_connect: patea

    environment:
      groups:
        - patea_ios
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.patea.app

    scripts:
      - name: Dependencias de Flutter
        script: flutter pub get

      - name: Pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Número de build
        # El build number lo manda TestFlight, no el pubspec: dos subidas con
        # el mismo número se rechazan, y acá se toma el último publicado y se
        # le suma uno. Así no hay que acordarse de subirlo a mano.
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --increment)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Compilar el IPA
        # El export_options.plist lo deja el paso de firma automática que
        # Codemagic corre solo a partir del bloque `ios_signing`.
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Sin grupos: la build queda disponible para los testers internos.
        # Para probadores externos hay que agregar `beta_groups:` con el
        # nombre del grupo, y esos sí pasan por revisión de Apple.
      email:
        recipients:
          - santiago.lopez@agileworks.com.uy
        notify:
          success: true
          failure: true
