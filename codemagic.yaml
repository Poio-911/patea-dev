# Builds de Pateá móvil: iOS a TestFlight y Android a Firebase App
# Distribution, las dos disparadas por un push.
#
# Vive en la raíz del repo porque Codemagic sólo busca `codemagic.yaml` ahí,
# aunque la app Flutter esté en `patea_mobile/` — de eso se encarga el
# `working_directory` de cada workflow. En Codemagic hay que elegir
# "codemagic.yaml" como fuente de la configuración.
#
# El detalle de por qué cada cosa está donde está (y qué se rompió antes de
# llegar acá) está en docs/technical/DEPLOYS_Y_VERSIONES.md.
#
# ── Numeración ──────────────────────────────────────────────────────────────
# El *nombre* de versión (1.0.2) sale de `version:` en pubspec.yaml y es el
# mismo para las dos plataformas. El *número* de build NO sale de ahí: cada
# tienda tiene su propia regla y se calcula en la corrida, así que no hay que
# acordarse de subir el `+N` a mano.

definitions:
  email_notification: &email_notification
    email:
      recipients:
        - santiago.lopez@agileworks.com.uy
      notify:
        success: true
        failure: true

  # Sólo interesa compilar cuando cambió la app o esta receta. Un commit que
  # toca la webapp o las Cloud Functions no tiene por qué gastar minutos de
  # build ni mandarle una entrega nueva a los testers.
  mobile_changes: &mobile_changes
    changeset:
      includes:
        - patea_mobile
        - codemagic.yaml

  push_to_branch: &push_to_branch
    events:
      - push
    branch_patterns:
      - pattern: feat/flutter-mobile-app
        include: true
        source: true
    cancel_previous_builds: true

workflows:

  # ──────────────────────────────────────────────────────────────────────────
  # iOS → TestFlight
  #
  # Requisitos cargados en Codemagic (una sola vez):
  #   · Integración de App Store Connect `patea` (clave de API "codemagic",
  #     rol "Gestor de apps", Key ID A2R79NVDJ3).
  #   · Grupo de variables `patea_ios` con APP_STORE_APPLE_ID=6808798274.
  #   · Team settings > Code signing identities:
  #       - certificado `patea_distribution` (generado por Codemagic, que se
  #         queda con la clave privada)
  #       - perfil `patea_appstore` (App Store, com.patea.app)
  # ──────────────────────────────────────────────────────────────────────────
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # La app Flutter no está en la raíz del repo: todo el workflow corre acá.
    working_directory: patea_mobile

    triggering:
      <<: *push_to_branch
    when:
      <<: *mobile_changes

    integrations:
      app_store_connect: patea

    environment:
      groups:
        - patea_ios
      flutter: stable
      xcode: latest
      cocoapods: default

      # Firma con material guardado en Codemagic, no emitido al vuelo. Se
      # llegó acá porque el equipo de Apple ya tenía un certificado de
      # distribución de otra app cuya clave privada Codemagic no tiene:
      # `fetch-signing-files --create` lo encontraba, no podía usarlo
      # ("Cannot save Signing Certificates without certificate private key")
      # y entonces tampoco emitía el perfil.
      ios_signing:
        certificates:
          - patea_distribution
        provisioning_profiles:
          - patea_appstore

    scripts:
      - name: Dependencias de Flutter
        script: flutter pub get

      - name: Aplicar la firma al proyecto de Xcode
        # Codemagic ya dejó certificado y perfil en el llavero; esto los
        # escribe en el proyecto y genera /Users/builder/export_options.plist,
        # que usa el build.
        script: xcode-project use-profiles

      - name: Pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Número de build
        # TestFlight rechaza dos subidas con el mismo número, así que el que
        # manda es el último publicado + 1. La primera vez no hay ninguno y el
        # comando falla: ahí se arranca en 1.
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            BUILD_NUMBER=1
          else
            BUILD_NUMBER=$((LATEST + 1))
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Compilar el IPA
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Sin `beta_groups`: la build queda para los testers internos. Los
        # externos pasan por revisión de Apple.
      <<: *email_notification

  # ──────────────────────────────────────────────────────────────────────────
  # Android → Firebase App Distribution
  #
  # DESACTIVADO hasta que estén cargados los dos secretos de abajo. No está
  # comentado por prolijidad: si un workflow referencia una variable o un
  # keystore que no existe, Codemagic marca **todo el archivo** como inválido
  # y deja de correr también el workflow de iOS. Se comprueba en el diálogo de
  # "Start new build", que muestra "codemagic.yaml is invalid".
  #
  # Para activarlo:
  #   1. Team settings > Code signing identities > Android keystores: subir
  #      ~/.patea-keys/patea-upload.jks (alias `patea-upload`) con su
  #      contraseña, nombre de referencia `patea_upload`.
  #   2. App > Environment variables: crear el grupo `patea_android` con
  #      FIREBASE_SERVICE_ACCOUNT = el JSON de una cuenta de servicio de
  #      mil-disculpis con rol "Firebase App Distribution Admin", marcada
  #      como secreta.
  #   3. Descomentar todo lo que sigue (quitar el "# " del principio de cada
  #      línea) y pushear.
