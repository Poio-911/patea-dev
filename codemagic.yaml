# Build de iOS para TestFlight.
#
# Vive en la raíz del repo porque Codemagic sólo busca `codemagic.yaml` ahí,
# aunque la app Flutter esté en `patea_mobile/` — de eso se encarga el
# `working_directory` del workflow. En Codemagic hay que elegir
# "codemagic.yaml" como fuente de la configuración del workflow.
#
# Antes de que corra hacen falta dos cosas cargadas en Codemagic:
#
#   1. Una integración de App Store Connect llamada `patea`, con la clave de
#      API "codemagic" (rol "Gestor de apps") generada en App Store Connect en
#      Usuarios y acceso > Integraciones. Se carga en Codemagic en
#      Teams > Personal Account > Integrations > Developer Portal.
#
#   2. Un grupo de variables llamado `patea_ios` con:
#        APP_STORE_APPLE_ID -> 6808798274 (el "Apple ID" numérico de la app en
#                              App Store Connect, el que aparece en la URL)
#
# El certificado y el perfil NO se cargan a mano: el paso "Firmar
# automáticamente" los emite y los renueva solo usando la clave de API. Es lo
# que evita el baile de certificados vencidos.

workflows:
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # La app Flutter no está en la raíz del repo: todo el workflow corre acá.
    working_directory: patea_mobile

    integrations:
      app_store_connect: patea

    environment:
      groups:
        - patea_ios
      vars:
        BUNDLE_ID: "com.patea.app"
      flutter: stable
      xcode: latest
      cocoapods: default

      # Sin bloque `ios_signing`: ese sólo BUSCA certificado y perfil ya
      # existentes y falla con "No matching profiles found" mientras no haya
      # ninguno emitido para el bundle id. Se firma con el paso de abajo, que
      # con `--create` los emite la primera vez y después los reusa.

    scripts:
      - name: Dependencias de Flutter
        script: flutter pub get

      - name: Firmar automáticamente
        # Emite (o reusa) el certificado de distribución y el provisioning
        # profile, y los deja aplicados en el proyecto de Xcode. También deja
        # escrito /Users/builder/export_options.plist, que usa el build.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Número de build
        # El build number lo manda TestFlight, no el pubspec: dos subidas con
        # el mismo número se rechazan, y acá se toma el último publicado y se
        # le suma uno. Así no hay que acordarse de subirlo a mano.
        script: |
          # La primera vez no hay ninguna build publicada y el comando falla:
          # ahí se arranca en 1.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            BUILD_NUMBER=1
          else
            BUILD_NUMBER=$((LATEST + 1))
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Compilar el IPA
        # El export_options.plist lo deja `xcode-project use-profiles`.
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Sin grupos: la build queda disponible para los testers internos.
        # Para probadores externos hay que agregar `beta_groups:` con el
        # nombre del grupo, y esos sí pasan por revisión de Apple.
      email:
        recipients:
          - santiago.lopez@agileworks.com.uy
        notify:
          success: true
          failure: true
